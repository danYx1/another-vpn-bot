name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot health endpoint
        run: |
          for i in 1 2 3 4; do
            if curl -fsS --max-time 30 https://another-vpn-bot.onrender.com/health; then
              echo "alive"
              exit 0
            fi
            sleep 20
          done
          echo "service is not responding"
          exit 1
